[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=40 -v"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["src/__init__.py"]

[tool.coverage.report]
exclude_lines = ["if __name__ == .__main__.:", "pragma: no cover"]

[tool.ruff]
target-version = "py314"
line-length = 120
extend-exclude = ["models", ".venv"]

# Lint rule set: pyflakes (F) + a subset of pycodestyle errors (E4/E7/E9).
# Pinned explicitly because ruff's default set grows across releases.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# job_main_mongo.py opens with the CURRENT_JOB constant before its imports (the
# job identity is the first thing a reader sees), which trips E402.
"src/job_main_mongo.py" = ["E402"]
